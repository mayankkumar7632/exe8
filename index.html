<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>student Management</h1>

        <!-- Contact Form -->

        <div class="form-container">

            <h2 id="formTitle">Add student here</h2>

            <form id="contactForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

                <input
                    type="text"
                    id="address"
                    placeholder="Enter address"
                >

                <button type="submit" id="submitButton">
                    Add 
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    class="cancel"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </form>

        </div>


        <!-- Contact List -->

        <div class="contacts-container">

            <h2>student List</h2>

            <div id="contactList"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
